<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
    <title>Grocery List</title>
</head>
<body>
    <div class="container">
        <h1>Grocery List</h1>
        <div class="items">
            <form class="form-row">
                <div class="form-group">
                    <input type="text" class="form-control" id="inputList" placeholder="Enter your list ex: egg">
                </div>
                <div class="btn">
                    <button type="submit" class="btn btn-primary">Add</button>
                </div>
            </form>
        </div>

        <!--Items lists output  -->
        <ul id="itmList"></ul>

        </ul>

        <!--Suppression des items  -->
        <div class="delete">
            <i id="clearItems" class="fa-solid fa-trash "></i>
        </div>
       
    </div>
</body>
</html>
